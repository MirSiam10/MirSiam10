<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="GitHub Analytics - system telemetry" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mono { font-family:'Fira Code',Consolas,'Courier New',monospace; }
      .title { font-weight:800; font-size:44px; letter-spacing:4px; fill:#fff; }
      .small { font-weight:600; font-size:14px; letter-spacing:2px; fill:#00f5ff; }
      .dim   { font-weight:600; font-size:13px; letter-spacing:1px; fill:#a78bfa; }
      .eq rect { fill:#00f5ff; transform-box:fill-box; transform-origin:bottom; animation:eq 1.2s ease-in-out infinite; }
      .eq rect:nth-child(2){animation-delay:.15s} .eq rect:nth-child(3){animation-delay:.3s} .eq rect:nth-child(4){animation-delay:.45s}
      .eq rect:nth-child(5){animation-delay:.6s}  .eq rect:nth-child(6){animation-delay:.75s} .eq rect:nth-child(7){animation-delay:.9s}
      .live { animation:pulse 1.2s ease-in-out infinite; }
      .sweep{ animation:sweep 4s linear infinite; }
      .ring { transform-box:fill-box; transform-origin:center; animation:spin 8s linear infinite; }
      @keyframes eq    { 0%,100%{transform:scaleY(.25)} 50%{transform:scaleY(1)} }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
      @keyframes sweep { from{transform:translateX(-140px)} to{transform:translateX(1000px)} }
      @keyframes spin  { to{transform:rotate(360deg)} }
    </style>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset=".55" stop-color="#302b63"/><stop offset="1" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#00f5ff"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00f5ff" stop-opacity=".25"/><stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00f5ff" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="c"><path d="M24 0H976L1000 24V126L976 150H24L0 126V24Z"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="150" fill="url(#bg)"/>
    <rect width="1000" height="150" fill="url(#grid)"/>
    <rect class="sweep" x="0" y="0" width="140" height="150" fill="url(#beam)"/>
  </g>
  <path d="M24 2H976L998 24V126L976 148H24L2 126V24Z" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- left radar ring -->
  <g transform="translate(78 75)">
    <circle r="36" fill="none" stroke="#00f5ff" stroke-opacity=".35" stroke-width="2"/>
    <circle r="22" fill="none" stroke="#7c3aed" stroke-opacity=".6" stroke-width="2"/>
    <g class="ring"><path d="M0 -36 A36 36 0 0 1 36 0" fill="none" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/></g>
    <circle r="4" fill="#00f5ff" class="live"/>
  </g>

  <text class="mono small" x="140" y="48">// SYSTEM TELEMETRY</text>
  <text class="mono title" x="140" y="92">GITHUB ANALYTICS</text>
  <text class="mono dim" x="140" y="120">USER: MirSiam10  ·  DATA STREAM: ACTIVE  ·  REFRESH: AUTO</text>

  <!-- right: live indicator + equalizer -->
  <circle class="live" cx="800" cy="46" r="6" fill="#00f5ff"/>
  <text class="mono small" x="816" y="51">LIVE FEED</text>
  <g class="eq">
    <rect x="800" y="70" width="10" height="50"/><rect x="816" y="70" width="10" height="50"/>
    <rect x="832" y="70" width="10" height="50"/><rect x="848" y="70" width="10" height="50"/>
    <rect x="864" y="70" width="10" height="50"/><rect x="880" y="70" width="10" height="50"/>
    <rect x="896" y="70" width="10" height="50"/>
  </g>
</svg>
